<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transport Destination</title>
  <link rel="stylesheet" href="/zon.css">
</head>
<body>
  <div class="transport">
    <h1>Transport Destination Calculator</h1>

    <label for="packageWeight">Weight (kg)</label>
    <input type="number" id="packageWeight" placeholder="Enter package weight">

    <label for="placeHolder">Zone</label>
    <select name="zone" id="placeHolder">
      <option value="nigeria">Nigeria</option>
      <option value="cameron">Cameron</option>
      <option value="egypt">Egypt</option>
      <option value="france">France</option>
    </select>

    <div class="box">
      <label for="checkDestination">Express Delivery?</label>
      <input type="checkbox" id="checkDestination">
    </div>

    <button onclick="submitForm()">Calculate</button>

    <!-- Result box -->
    <div  id="result"></div>
  </div>

  <script src="/zone.js"></script>
</body>
</html>
